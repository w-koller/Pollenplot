[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
composeBom = "2026.09.00"
# Material 3 Expressive components are stable only in the 1.5 line, which is newer than the BOM's material3.
material3 = "1.5.0-beta02"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
navigation = "2.10.2"
room = "2.8.5"
datastore = "1.2.1"
work = "2.12.0"
coroutines = "1.11.0"
serialization = "1.12.0"
graphicsShapes = "1.0.1"
camerax = "1.6.2"
litert = "2.3.0"
litertlm = "0.18.0"
onnxruntime = "1.31.0"
coil = "3.6.3"
exifinterface = "1.4.2"
junit = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
