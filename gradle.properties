org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The text model behind search by meaning, bge-small-en-v1.5 (MIT), as quantised ONNX. The app downloads it when the
# user asks; the :ml tests download it once to check the app's tokenizer and embedder against the reference outputs.
pollenplot.bge.url=https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/ea104dacec62c0de699686887e3f920caeb4f3e3/onnx/model_quantized.onnx
pollenplot.bge.sha256=6c9c6101a956d62dfb5e7190c538226c0c5bb9cb27b651234b6df063ee7dbfe4
pollenplot.bge.bytes=34014426

# The accurate identification pack, built from BioCAP by .github/workflows/models.yml and published as a release. The
# SHA-256 and size are filled in once the pack is published; until then the app says the pack is not ready.
pollenplot.biocap.pack=1
pollenplot.biocap.url=https://github.com/w-koller/Pollenplot/releases/download/biocap-pack-1/biocap-pack-1.zip
pollenplot.biocap.sha256=
pollenplot.biocap.bytes=0
