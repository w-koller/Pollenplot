org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The text model behind search by meaning, bge-small-en-v1.5 (MIT), as quantised ONNX. The app downloads it when the
# user asks; the :ml tests download it once to check the app's tokenizer and embedder against the reference outputs.
pollenplot.bge.url=https://huggingface.co/Xenova/bge-small-en-v1.5/resolve/ea104dacec62c0de699686887e3f920caeb4f3e3/onnx/model_quantized.onnx
pollenplot.bge.sha256=6c9c6101a956d62dfb5e7190c538226c0c5bb9cb27b651234b6df063ee7dbfe4
pollenplot.bge.bytes=34014426

# The accurate identification pack, built from BioCAP by .github/workflows/models.yml and published as a release from
# the run that evaluated it (run 40712841563): 13,644 plants, animals and fungi.
pollenplot.biocap.pack=1
pollenplot.biocap.url=https://github.com/w-koller/Pollenplot/releases/download/biocap-pack-1/biocap-pack-1.zip
pollenplot.biocap.sha256=a1f9e342fc7b2310b42af2c34c7e6a250ddf76d10df6e807cd69e34e6f1cdc36
pollenplot.biocap.bytes=127359368

# Gemma 4 E2B (Apache 2.0) for the garden assistant, as LiteRT-LM, at a fixed revision so the file always matches its
# SHA-256. The app downloads it on Wi-Fi when the user asks; it is never downloaded on a development machine.
pollenplot.gemma.url=https://huggingface.co/litert-community/gemma-4-E2B-it-litert-lm/resolve/b3ca0d2f076785a8f4b2219ddbd2bdb99954eae1/gemma-4-E2B-it.litertlm
pollenplot.gemma.sha256=181938105e0eefd105961417e8da75903eacda102c4fce9ce90f50b97139a63c
pollenplot.gemma.bytes=2588147712
